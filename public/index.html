<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الإخراج | VideoForge AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Cairo', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="antialiased min-h-screen">
    <header class="border-b border-white/5 glass-panel sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-purple-500 flex items-center justify-center">
                <i class="fa-solid fa-robot text-white"></i>
            </div>
            <span class="text-xl font-bold">VideoForge <span class="text-cyan-500">AI</span></span>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold mb-3">الأتمتة الكاملة (المكتبة الذكية)</h1>
            <p class="text-gray-400">السيرفر سيقوم بجلب الصور والترجمة والنطق تلقائياً بناءً على الكلمات التي تدخلها!</p>
        </div>

        <div class="glass-panel p-8 rounded-3xl border border-white/10 max-w-4xl mx-auto shadow-2xl">
            <!-- 1. الحرف الأساسي للدرس -->
            <div class="mb-8 border-b border-gray-700 pb-8">
                <label class="block text-lg font-bold text-pink-400 mb-2"><i class="fa-solid fa-font"></i> 1. الحرف الإبداعي (للمشهد الأول)</label>
                <input type="text" id="letter-upload" placeholder="مثال: A a" class="w-full bg-white/5 border-2 border-dashed border-pink-500 rounded-xl p-4 text-center text-2xl font-bold text-white focus:outline-none focus:border-pink-400">
            </div>

            <!-- 2. الصوت الأساسي -->
            <div class="mb-8 border-b border-gray-700 pb-8 relative group cursor-pointer">
                <label class="block text-lg font-bold text-purple-400 mb-2"><i class="fa-solid fa-microphone"></i> 2. التعليق الصوتي للدرس (إجباري)</label>
                <input type="file" id="audio-upload" accept="audio/*" class="absolute inset-0 top-10 w-full h-full opacity-0 z-20 cursor-pointer">
                <div class="p-6 rounded-xl border-2 border-dashed border-gray-600 group-hover:border-purple-500 transition-colors bg-white/5 flex flex-col items-center justify-center text-center">
                    <i class="fa-solid fa-file-audio text-2xl text-purple-500 mb-2"></i>
                    <h4 class="font-bold text-md">اختر ملف الصوت</h4>
                    <span id="audio-status" class="mt-2 text-xs text-purple-400 font-semibold hidden"></span>
                </div>
            </div>

            <!-- 3. الكلمات المطلوبة -->
            <div class="mb-8">
                <label class="block text-lg font-bold text-cyan-400 mb-2"><i class="fa-solid fa-keyboard"></i> 3. الكلمات التي يشرحها الدرس</label>
                <p class="text-xs text-gray-400 mb-3">اكتب الكلمات مفصولة بفاصلة. سيقوم السيرفر بترجمتها وسحب صورها من مجلد library تلقائياً.</p>
                <textarea id="words-input" rows="3" class="w-full bg-white/5 border-2 border-dashed border-cyan-500 rounded-xl p-4 text-left text-xl font-bold text-white focus:outline-none focus:border-cyan-400" dir="ltr" placeholder="Apple, Ant, Alligator, Airplane, Arrow, Arm"></textarea>
            </div>

            <div class="mt-8 text-center">
                <button id="render-btn" class="px-10 py-4 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-xl font-bold text-lg hover:scale-105 transition-transform w-full md:w-auto shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> بناء الفيديو بالذكاء الاصطناعي
                </button>
            </div>
        </div>
        
        <div class="max-w-4xl mx-auto mt-10 bg-[#0d1117] rounded-xl border border-gray-700 overflow-hidden shadow-2xl" dir="ltr">
            <div class="p-4 font-mono text-sm h-48 overflow-y-auto" id="terminal-output">
                <div class="text-green-400">$ System Ready...</div>
                <div class="text-gray-400">Waiting for automatic rendering task...</div>
            </div>
        </div>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);
        const API = location.protocol === 'file:' ? 'http://localhost:3000' : '';

        $('audio-upload').addEventListener('change', (e) => {
            const f = e.target.files;
            if(!f.length) return;
            $('audio-status').classList.remove('hidden');
            $('audio-status').textContent = `تم اختيار: ${f[0].name.substring(0,20)}`;
        });

        const log = (msg, color = 'text-gray-300') => {
            $('terminal-output').innerHTML += `<div class="${color} mt-1">${msg}</div>`;
            $('terminal-output').scrollTop = $('terminal-output').scrollHeight;
        };

        $('render-btn').addEventListener('click', async () => {
            const audioFile = $('audio-upload').files[0];
            const letterText = $('letter-upload').value.trim();
            const wordsText = $('words-input').value.trim();

            if (!audioFile) return alert('التعليق الصوتي إجباري!');
            if (!wordsText) return alert('يرجى كتابة الكلمات!');

            $('render-btn').disabled = true;
            $('render-btn').innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> جاري إرسال الطلب...';
            log('$ Analyzing words and searching library...', 'text-cyan-400');

            const formData = new FormData();
            formData.append('audio', audioFile);
            formData.append('letter_text', letterText);
            formData.append('words_list', wordsText); // نرسل النص المدمج فقط

            try {
                const res = await fetch(`${API}/generate-video-auto`, { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'حدث خطأ');
                log(`$ Success: ${data.message}`, 'text-green-400');
                $('render-btn').innerHTML = '<i class="fa-solid fa-check mr-2"></i> راقب الشاشة السوداء';
                $('render-btn').className = "px-10 py-4 bg-green-600 rounded-xl font-bold text-lg w-full md:w-auto";
            } catch (err) {
                log(`$ Error: ${err.message}`, 'text-red-500');
                $('render-btn').disabled = false;
                $('render-btn').innerHTML = 'فشلت العملية، حاول مجدداً';
            }
        });
    </script>
</body>
</html>
